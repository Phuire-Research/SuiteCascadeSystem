<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratimux Muxonomy — The Circle's Face is a Manifold</title>
  <meta name="description" content="An interactive geometric proof establishing Diameter, Demometer, and Muxameter — the measurement framework of the Suite Cascade System (ARIOS).">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0; background:#0d0d1a;">
  <div id="root"></div>
  <script type="text/babel">
const { useState, useRef } = React;


const C = {
  bg: "#0d0d1a", sf: "#16162a", sl: "#1e1e3a",
  tx: "#e8e6e3", tm: "#9997a0",
  ac: "#cc7722", di: "#ff6b4a", de: "#4ac1ff",
  mx: "#4affcf", am: "#9966cc", rs: "#ff007f",
  like: "#4affcf", unlike: "#ff007f",
  within: "#4ac1ff", from: "#ff6b4a",
};

const PI = Math.PI;
const polyVerts = (M) => Array.from({ length: M }, (_, k) => {
  const a = 2 * PI * k / M - PI / 2;
  return [Math.cos(a), Math.sin(a)];
});
const chords = (() => {
  const c = [2]; let s = Math.sqrt(2);
  for (let i = 1; i <= 12; i++) { c.push(s); s = Math.sqrt(2 - Math.sqrt(4 - s * s)); }
  return c;
})();
const piApprox = (n) => n === 0 ? 2 : Math.pow(2, n + 1) * chords[n] / 2;
const arcLen = (n) => 2 * PI / Math.pow(2, n + 1);

function Nav({ active, onNav }) {
  const labels = ["Origin", "I. Dyad", "II. Bidirectional", "III. Finite", "IV. Validate", "V. Order", "VI. Minimal", "VII. Muxonomy", "VIII. Taxonomy"];
  return (
    <div style={{ display: "flex", gap: 3, overflowX: "auto", padding: "0 0 10px", marginBottom: 14, borderBottom: `1px solid ${C.sl}` }}>
      {labels.map((l, i) => (
        <button key={i} onClick={() => onNav(i)} style={{
          background: active === i ? C.ac : "transparent", color: active === i ? C.bg : C.tm,
          border: `1px solid ${active === i ? C.ac : C.sl}`, borderRadius: 6,
          padding: "4px 7px", fontSize: 8, fontWeight: 700, cursor: "pointer",
          fontFamily: "'Orbitron', sans-serif", whiteSpace: "nowrap", flexShrink: 0,
        }}>{l}</button>
      ))}
    </div>
  );
}

function Card({ color, children }) {
  return <div style={{ background: `${color}10`, border: `1px solid ${color}33`, borderRadius: 12, padding: 14, marginBottom: 12 }}>{children}</div>;
}

function STitle({ num, title, sub }) {
  return (
    <div style={{ marginBottom: 14, textAlign: "center" }}>
      {num && <div style={{ fontSize: 10, color: C.am, fontFamily: "'Orbitron', sans-serif", fontWeight: 700, letterSpacing: "2px" }}>SECTION {num}</div>}
      <div style={{ fontSize: 15, color: C.tx, fontFamily: "'Orbitron', sans-serif", fontWeight: 900, marginTop: 4 }}>{title}</div>
      {sub && <div style={{ fontSize: 10, color: C.tm, marginTop: 4, lineHeight: 1.5 }}>{sub}</div>}
    </div>
  );
}

function Slider({ value, min, max, onChange, label }) {
  return (
    <div style={{ textAlign: "center", margin: "10px 0" }}>
      <div style={{ fontSize: 10, color: C.tm, marginBottom: 4 }}>{label}: <span style={{ color: C.ac, fontWeight: 700, fontSize: 14 }}>{value}</span></div>
      <input type="range" min={min} max={max} value={value} onChange={e => onChange(+e.target.value)} style={{ width: "80%", accentColor: C.ac }} />
    </div>
  );
}

// ─── SECTION I: THE DYAD — ORDERS OF DYADIC DIAMETERS ───
function DyadicDiameterProof() {
  const [n, setN] = useState(0);
  const D = Math.pow(2, n);
  const M = 2 * D;
  const theta = 180 / D;
  const cx = 120, cy = 120, r = 95;

  return (
    <div>
      <STitle num="I" title="The Diametric Dyad" sub="The Diameter produces the Demometers — two parallel dyadic ladders, offset by one order" />
      <svg viewBox="0 0 240 240" style={{ width: "100%", maxWidth: 260, display: "block", margin: "0 auto" }}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={`${C.tm}44`} strokeWidth={1.5} />
        {/* n=0 · the dual reading held at once: the drawn singular Diameter
            anor the undrawn Entire Manifold (the dashed ring) */}
        {n === 0 && <circle cx={cx} cy={cy} r={r} fill={`${C.de}0a`}
          stroke={`${C.di}66`} strokeWidth={1.5} strokeDasharray="4 4" />}
        {/* Draw sectors */}
        {Array.from({ length: M }, (_, i) => {
          const a1 = 2 * PI * i / M - PI / 2;
          const a2 = 2 * PI * (i + 1) / M - PI / 2;
          const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
          const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
          const lg = (a2 - a1) > PI ? 1 : 0;
          return <path key={`s${i}`} d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${lg} 1 ${x2},${y2} Z`}
            fill={`${C.de}10`} stroke={`${C.mx}44`} strokeWidth={0.5} />;
        })}
        {/* Draw diameters */}
        {Array.from({ length: D }, (_, i) => {
          const a = PI * i / D - PI / 2;
          return <line key={`d${i}`} x1={cx + r * Math.cos(a)} y1={cy + r * Math.sin(a)}
            x2={cx - r * Math.cos(a)} y2={cy - r * Math.sin(a)}
            stroke={C.di} strokeWidth={n === 0 ? 2.5 : 1.5} opacity={0.7} />;
        })}
        <circle cx={cx} cy={cy} r={3} fill={C.ac} />
        {n === 0 && <text x={cx} y={cy - r - 12} textAnchor="middle" fill={C.di} fontSize="9"
          fontWeight="900" fontFamily="'Orbitron', sans-serif" opacity={0.7}>DRAWN ANOR THE ENTIRE MANIFOLD</text>}
      </svg>

      {/* Stepper */}
      <div style={{ display: "flex", justifyContent: "center", gap: 4, margin: "10px 0" }}>
        {[0, 1, 2, 3, 4, 5, 6, 7].map(i => (
          <button key={i} onClick={() => setN(i)} style={{
            width: 34, height: 34, borderRadius: 8,
            background: n === i ? C.mx : "transparent",
            color: n === i ? C.bg : C.mx,
            border: `1.5px solid ${n === i ? C.mx : `${C.mx}44`}`,
            fontFamily: "'Orbitron', sans-serif", fontSize: 12, fontWeight: 900, cursor: "pointer",
          }}>{i}</button>
        ))}
      </div>

      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginTop: 8 }}>
        <div style={{ background: `${C.am}11`, border: `1px solid ${C.am}33`, borderRadius: 8, padding: 8, textAlign: "center" }}>
          <div style={{ fontSize: 8, color: C.am, fontFamily: "'Orbitron', sans-serif", fontWeight: 700 }}>PAIRS</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: C.tx, fontFamily: "'Orbitron', sans-serif" }}>{n === 0 ? "0" : Math.pow(2, n - 1)}</div>
          {n === 0
            ? <div style={{ fontSize: 8, color: C.tm }}>origin of the count</div>
            : <div style={{ fontSize: 8, color: C.tm }}>2<sup>{n - 1}</sup></div>}
        </div>
        <div style={{ background: `${C.di}11`, border: `1px solid ${C.di}33`, borderRadius: 8, padding: 8, textAlign: "center" }}>
          <div style={{ fontSize: 8, color: C.di, fontFamily: "'Orbitron', sans-serif", fontWeight: 700 }}>DIAMETERS</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: C.tx, fontFamily: "'Orbitron', sans-serif" }}>{D}</div>
          <div style={{ fontSize: 8, color: C.tm }}>2<sup>{n}</sup></div>
          {n === 0 && <div style={{ fontSize: 7, color: C.am, marginTop: 2, fontStyle: "italic" }}>drawn anor undrawn — the Entire Manifold</div>}
        </div>
        <div style={{ background: `${C.de}11`, border: `1px solid ${C.de}33`, borderRadius: 8, padding: 8, textAlign: "center", position: "relative" }}>
          <div style={{ fontSize: 8, color: C.de, fontFamily: "'Orbitron', sans-serif", fontWeight: 700 }}>DEMOMETERS</div>
          <div style={{ fontSize: 18, fontWeight: 900, color: C.tx, fontFamily: "'Orbitron', sans-serif" }}>{M}</div>
          <div style={{ fontSize: 8, color: C.tm }}>2<sup>{n + 1}</sup></div>
          {n === 0 && <div style={{ fontSize: 7, color: C.am, marginTop: 2, fontStyle: "italic" }}>← Pre-Origin: 1 Whole Face</div>}
        </div>
        <div style={{ background: `${C.ac}11`, border: `1px solid ${C.ac}33`, borderRadius: 8, padding: 8, textAlign: "center" }}>
          <div style={{ fontSize: 8, color: C.ac, fontFamily: "'Orbitron', sans-serif", fontWeight: 700 }}>θ / SECTOR</div>
          <div style={{ fontSize: 14, fontWeight: 900, color: C.tx, fontFamily: "'Orbitron', sans-serif" }}>{theta}°</div>
          <div style={{ fontSize: 8, color: C.tm }}>180°/2<sup>{n}</sup></div>
        </div>
      </div>

      {/* Description */}
      <div style={{ background: C.sf, borderRadius: 10, padding: 12, marginTop: 10, textAlign: "center",
        fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.tm, lineHeight: 1.7 }}>
        {n === 0 && <><span style={{ color: C.ac, fontWeight: 700 }}>Origin · 2<sup>0</sup> = 1 — the multiplicative identity, held two ways.</span><br />
          1/1 undrawn — <span style={{ color: C.di, fontWeight: 700 }}>the Entire Manifold</span> — anor <span style={{ color: C.di }}>1 Diameter</span> drawn: the singular through-measure, the unit itself.<br />
          Pairs = 0 — N is the Origin of the COUNT: the Diameter at Origin is the beginning of the measure of Diameters. The First Pair arrives at 2<sup>1</sup> = 2. On the backside the fold starts early: Pre-Origin −1 = the Radius.<br />
          A <span style={{ color: C.de }}>Demometer</span> must always have a Diameter; a Diameter may not be drawn — and is then the Entire Manifold.<br />
          The drawn reading seeds Viète: the flattened 2-gon, perimeter 2D → π ≈ 2.<br />
          <span style={{ color: C.am, fontSize: 10 }}>The measure of a Circle is by Diameters — the working measurement informing Different Measures within the Circle.</span></>}
        {n === 1 && <><span style={{ color: C.am, fontWeight: 700 }}>1st Order · 2<sup>0</sup> = 1 Dyad.</span><br /><span style={{ color: C.mx }}>2 Diameters</span> perpendicular. <span style={{ color: C.de }}>4 equal quadrants</span>.<br />The first complete Pair.</>}
        {n === 2 && <><span style={{ color: C.am, fontWeight: 700 }}>2nd Order · 2<sup>1</sup> = 2 Dyads.</span><br /><span style={{ color: C.mx }}>4 Diameters</span>. <span style={{ color: C.de }}>8 equal 45° sectors</span>.<br />Each order doubles the prior Pair count.</>}
        {n === 3 && <><span style={{ color: C.am, fontWeight: 700 }}>3rd Order · 2<sup>2</sup> = 4 Dyads.</span><br /><span style={{ color: C.mx }}>8 Diameters</span>. <span style={{ color: C.de }}>16 equal 22.5° sectors</span>.<br />θ halves at each doubling.</>}
        {n === 4 && <><span style={{ color: C.am, fontWeight: 700 }}>4th Order · 2<sup>3</sup> = 8 Dyads.</span><br /><span style={{ color: C.mx }}>16 Diameters</span>. <span style={{ color: C.de }}>32 equal sectors</span>.<br />11.25° per sector.</>}
        {n === 5 && <><span style={{ color: C.am, fontWeight: 700 }}>5th Order · 2<sup>4</sup> = 16 Dyads.</span><br /><span style={{ color: C.mx }}>32 Diameters</span>. <span style={{ color: C.de }}>64 equal sectors</span>.<br />5.625° per sector.</>}
        {n === 6 && <><span style={{ color: C.am, fontWeight: 700 }}>6th Order · 2<sup>5</sup> = 32 Dyads.</span><br /><span style={{ color: C.mx }}>64 Diameters</span>. <span style={{ color: C.de }}>128 equal sectors</span>.<br />Beyond Archimedes' 96-gon.</>}
        {n === 7 && <><span style={{ color: C.am, fontWeight: 700 }}>7th Order · 2<sup>6</sup> = 64 Dyads.</span><br /><span style={{ color: C.mx }}>128 Diameters</span>. <span style={{ color: C.de }}>256 equal sectors</span>.<br />1.40625° per sector. The polygon approaches the circle.</>}
      </div>

      {/* Invariants */}
      <div style={{ background: `${C.am}08`, border: `1px solid ${C.am}33`, borderRadius: 10, padding: 10, marginTop: 10, textAlign: "center",
        fontSize: 10, color: C.tx, lineHeight: 1.8 }}>
        <span style={{ color: C.am, fontWeight: 700, fontFamily: "'Orbitron', sans-serif", fontSize: 9, letterSpacing: "1px" }}>DYADIC EXPONENT LADDER · INVARIANT AT EVERY ORDER</span><br />
        <span style={{ color: C.am }}>P</span> = 2<sup>n−1</sup> from n = 1 (0 at Origin — the count begins) ·{" "}
        <span style={{ color: C.di }}>D</span> = 2<sup>n</sup> ·{" "}
        <span style={{ color: C.de }}>M</span> = 2<span style={{ color: C.di }}>D</span> = 2<sup>n+1</sup> ·{" "}
        <span style={{ color: C.ac }}>θ</span> = 180°/2<sup>n</sup>
      </div>

      {/* ── PEWTER ALIGNMENT TRIAD — Two Ladders, One Frame ── */}
      <div style={{
        marginTop: 12,
        background: `linear-gradient(135deg, ${C.am}10, ${C.de}06)`,
        border: `1px solid ${C.am}44`,
        borderRadius: 12,
        padding: "12px 10px",
        boxShadow: `inset 0 1px 0 ${C.am}33, 0 1px 0 ${C.bg}, 0 2px 6px ${C.bg}`,
      }}>
        <div style={{ textAlign: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 9, color: C.am, fontFamily: "'Orbitron', sans-serif", fontWeight: 700, letterSpacing: "1.5px" }}>DYADIC ALIGNMENT TRIAD</div>
          <div style={{ fontSize: 9, color: C.tm, marginTop: 3 }}>Language · Mathematics · Geometry — held in one Pewter frame</div>
        </div>
        {(() => {
          {/* The uniform law: D = 2^n · M = 2^(n+1) at EVERY station — the fold
              starts early (Pre-Origin −1 = the Radius); Origin 0 = the drawn
              singular Diameter anor the undrawn Entire Manifold. */}
          const positions = [
            { idx: -1, label: "Pre-Origin", D: "½", M: "1", Dexp: "2⁻¹", Mexp: "2⁰", lang: "Whole Face", geo: "○" },
            { idx: 0,  label: "Origin",     D: "1", M: "2", Dexp: "2⁰",  Mexp: "2¹",  lang: "Halves",     geo: "⊖" },
            { idx: 1,  label: "1st Order",  D: "2", M: "4", Dexp: "2¹",  Mexp: "2²",  lang: "Quadrants",  geo: "✚" },
            { idx: 2,  label: "2nd Order",  D: "4", M: "8", Dexp: "2²",  Mexp: "2³",  lang: "Sectors",    geo: "✱" },
          ];
          return (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 5 }}>
              {positions.map((p, i) => {
                const active = p.idx === n;
                const tileBg = active ? `linear-gradient(160deg, ${C.am}30, ${C.di}18)` : `linear-gradient(160deg, ${C.am}08, ${C.bg})`;
                const tileBorder = active ? `1.5px solid ${C.am}` : `1px solid ${C.am}33`;
                return (
                  <div key={i} style={{
                    background: tileBg,
                    border: tileBorder,
                    borderRadius: 8,
                    padding: "7px 4px",
                    textAlign: "center",
                    boxShadow: active
                      ? `inset 0 1px 0 ${C.am}66, 0 0 8px ${C.am}44`
                      : `inset 0 1px 0 ${C.am}22, 0 1px 0 ${C.bg}`,
                    transition: "all 0.2s",
                  }}>
                    {/* POSITION */}
                    <div style={{ fontSize: 7, color: active ? C.ac : C.tm, fontFamily: "'Orbitron', sans-serif", fontWeight: 700, letterSpacing: "0.5px", marginBottom: 4 }}>{p.label}</div>
                    {/* GEOMETRY tessera */}
                    <div style={{ fontSize: 18, color: active ? C.de : `${C.de}88`, fontWeight: 900, lineHeight: 1, marginBottom: 4 }}>{p.geo}</div>
                    {/* LANGUAGE tessera */}
                    <div style={{ fontSize: 8, color: active ? C.de : C.tm, fontStyle: "italic", marginBottom: 5 }}>{p.lang}</div>
                    {/* MATHEMATICS tessera — both ladders */}
                    <div style={{ borderTop: `1px solid ${C.am}22`, paddingTop: 4, lineHeight: 1.4 }}>
                      <div style={{ fontSize: 8, color: C.di }}>D: {p.Dexp} ({p.D})</div>
                      <div style={{ fontSize: 8, color: C.de }}>M: {p.Mexp} ({p.M})</div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}
        <div style={{ marginTop: 9, padding: "6px 8px", background: `${C.bg}aa`, borderRadius: 6, border: `1px solid ${C.am}22`, textAlign: "center", fontSize: 9, color: C.tm, lineHeight: 1.6 }}>
          Pre-Origin holds <span style={{ color: C.am, fontWeight: 700 }}>M = 2⁰ = 1 Whole Face</span> while the Diameter holds
          <span style={{ color: C.am, fontWeight: 700 }}> D = 2⁻¹ — the Radius</span>: the fold starts early.
          One uniform law — D = 2ⁿ, M = 2ⁿ⁺¹ — both ladders in lockstep, the Demometer always one exponent ahead.
        </div>
      </div>
    </div>
  );
}

// ─── SECTION II: THE BIDIRECTIONAL DYADIC ───
// Builds on Section I (the Dyadic Diameter Proof). Extends Pre-Origin from position to direction:
// N continues into −∞ just as it extends to +∞. Origin is a fulcrum, not a floor.

function BDCircle({ cx, cy, r, diameters, highlight }) {
  const sectors = diameters > 0 ? diameters * 2 : 1;
  const sectorEls = [];
  for (let i = 0; i < sectors; i++) {
    const a1 = 2 * PI * i / sectors - PI / 2;
    const a2 = 2 * PI * (i + 1) / sectors - PI / 2;
    const x1 = cx + r * Math.cos(a1);
    const y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2);
    const y2 = cy + r * Math.sin(a2);
    const lg = (a2 - a1) > PI ? 1 : 0;
    const isHi = highlight !== null && i === highlight;
    // The Demometer wears its OWN color: faces fill in de (counted Faces
    // visible); selection highlights in de; mx stays reserved for Muxameters.
    sectorEls.push(
      <path key={`s${i}`}
        d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${lg} 1 ${x2},${y2} Z`}
        fill={isHi ? `${C.de}55` : `${C.de}18`}
        stroke={isHi ? C.de : `${C.de}26`}
        strokeWidth={isHi ? 1.5 : 0.5} />
    );
  }
  const dEls = [];
  for (let i = 0; i < diameters; i++) {
    const a = PI * i / diameters - PI / 2;
    dEls.push(
      <line key={`d${i}`}
        x1={cx + r * Math.cos(a)} y1={cy + r * Math.sin(a)}
        x2={cx - r * Math.cos(a)} y2={cy - r * Math.sin(a)}
        stroke={C.di} strokeWidth={1.5} opacity={0.75} />
    );
  }
  return (
    <g>
      {sectorEls}
      {dEls}
      <circle cx={cx} cy={cy} r={2.5} fill={C.ac} />
    </g>
  );
}

function BDBadge({ x, y, text }) {
  const w = text.length * 7 + 10;
  return (
    <g>
      <rect x={x - w / 2} y={y - 9} width={w} height={16}
        fill={C.bg} stroke={C.mx} strokeWidth={0.8} rx={3} />
      <text x={x} y={y + 3} textAnchor="middle"
        fill={C.mx} fontSize="10" fontWeight="900"
        fontFamily="'Orbitron', sans-serif">{text}</text>
    </g>
  );
}

// MODE 2 — DYADIC DEMOMETER. captions default ON — the Muxameter's reuse
// branch passes captions={false} so its own captions stand alone.
function BDDemometerViz({ N, captions = true }) {
  const absN = N < 0 ? -N : N;
  const cx = 120, cy = 120, R = 80;
  const orbi = "'Orbitron', sans-serif";

  if (N >= 0) {
    const dCount = N === 0 ? 1 : Math.pow(2, N);
    const posM = Math.pow(2, N + 1);
    return (
      <g>
        <BDCircle cx={cx} cy={cy} r={R} diameters={dCount} highlight={null} />
        {captions && <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.de} fontSize="8" fontWeight="900" fontFamily={orbi}>{N === 0 ? "2 DEMOMETERS · M = 2^(0+1) · THE PAIR" : `${posM} DEMOMETERS · M = 2^(${N}+1)`}</text>}
        {captions && <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.de}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>{N === 0 ? "CUT BY THE ONE DRAWN DIAMETER" : "THE CLASSIC SECTORS — TO THE ARC"}</text>}
      </g>
    );
  }

  // N = -1 → 1 Demometer: the Whole Face drawn in the Demometer color —
  // a Demometer anor a Manifold — with the Radius (1/2 a Diameter, in the
  // Diameter's color) shown WITHIN: the last means of similarity between
  // the Measures at -1.
  if (N === -1) {
    const labelR = R * 0.55;
    const midAng = PI;
    return (
      <g>
        <circle cx={cx} cy={cy} r={R} fill={`${C.de}33`} stroke={C.de} strokeWidth={2} />
        <line x1={cx} y1={cy} x2={cx - R} y2={cy} stroke={C.di} strokeWidth={2.5} />
        <circle cx={cx} cy={cy} r={3} fill={C.ac} />
        <BDBadge x={cx + labelR * Math.cos(midAng)} y={cy + labelR * Math.sin(midAng) - 16} text="1" />
        {captions && <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.de} fontSize="9" fontWeight="900" fontFamily={orbi}>DEMOMETER 1 · THE WHOLE FACE</text>}
        {captions && <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.de}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>THE RADIUS WITHIN — THE LAST SIMILARITY</text>}
      </g>
    );
  }

  // N <= -2 → one circle: 2^(|N|-1) potential Faces, ONE selected — in the
  // negatives we are SELECTING specific Faces; no pairing needed. Selection
  // stays on the LEFT (K/2): the stepping narrows in place, no side-jump.
  const labelR = R * 0.55;
  const midAng = PI;
  const negK = Math.pow(2, absN - 1);
  const negDiameters = Math.pow(2, absN - 2);

  return (
    <g>
      <BDCircle cx={cx} cy={cy} r={R} diameters={negDiameters} highlight={negK / 2} />
      <BDBadge x={cx + labelR * Math.cos(midAng)} y={cy + labelR * Math.sin(midAng)} text={`1/${negK}`} />
      {captions && <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.de} fontSize="9" fontWeight="900" fontFamily={orbi}>{`DEMOMETER 1/${negK} · SELECTED FROM ${negK}`}</text>}
      {captions && <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.de}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>SELECTION BORNE FROM ORIGIN</text>}
    </g>
  );
}

// MODE 1 — DYADIC MUXAMETER: mirrors the Demometer (M = 2^(N+1) at every
// station); separates only at N >= 1, where the Dyadic (the 2nd Diameter)
// introduces the connecting edge — each sector gains the chord that does NOT
// extend to the arc: the triangles. At N <= 0 it is exactly the same as the
// Demometer (the arc is still a line, and is valid; no 3rd vertex placeable).
function BDMuxameterViz({ N }) {
  const cx = 120, cy = 120, R = 80;
  const orbi = "'Orbitron', sans-serif";

  // N >= 1 → the Dyadic introduced: M triangles — sector + connecting edge
  if (N >= 1) {
    const M = Math.pow(2, N + 1);
    const verts = [];
    for (let k = 0; k < M; k++) {
      const a = (2 * PI * k) / M - PI / 2;
      verts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
    }
    const tris = verts.map((v, k) => {
      const w = verts[(k + 1) % M];
      return `M ${cx},${cy} L ${v[0]},${v[1]} L ${w[0]},${w[1]} Z`;
    });
    return (
      <g>
        <circle cx={cx} cy={cy} r={R} fill="none" stroke={`${C.mx}33`} strokeWidth={1} />
        {tris.map((d, i) => <path key={`t${i}`} d={d} fill={`${C.mx}22`} stroke={`${C.mx}55`} strokeWidth={0.8} />)}
        <polygon points={verts.map(v => v.join(",")).join(" ")} fill="none" stroke={C.mx} strokeWidth={2} />
        <circle cx={cx} cy={cy} r={3} fill={C.mx} />
        <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.mx} fontSize="9" fontWeight="900" fontFamily={orbi}>{`${M} MUXAMETERS · M = 2^(${N}+1)`}</text>
        <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.mx}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>SECTOR + CONNECTING EDGE — THE DYADIC</text>
      </g>
    );
  }

  // N = 0 → 2 Muxameters, the two halves; no 3rd vertex placeable.
  // Vertical divider — the same drawn Diameter as the Demometer's Pair.
  if (N === 0) {
    return (
      <g>
        <circle cx={cx} cy={cy} r={R} fill={`${C.mx}22`} stroke={C.mx} strokeWidth={2} />
        <line x1={cx} y1={cy - R} x2={cx} y2={cy + R} stroke={C.mx} strokeWidth={2} />
        <circle cx={cx} cy={cy} r={3} fill={C.mx} />
        <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.mx} fontSize="8" fontWeight="900" fontFamily={orbi}>2 MUXAMETERS · M = 2^(0+1) · THE TWO HALVES</text>
        <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.am}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>NO 3RD VERTEX — THE ARC IS THE VALID LINE</text>
      </g>
    );
  }

  // N = -1, -2 → exactly the same as the Demometer (no internal triangle
  // drawable: the whole Face has no legs; the half's edge would BE the
  // Diameter itself)
  if (N >= -2) {
    const negBadge = N === -1 ? "1" : "1/2";
    return (
      <g>
        <BDDemometerViz N={N} captions={false} />
        <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.mx} fontSize="9" fontWeight="900" fontFamily={orbi}>{`MUXAMETER ${negBadge} · SAME AS THE DEMOMETER`}</text>
        <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.mx}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>THE ARC IS THE VALID LINE</text>
      </g>
    );
  }

  // N <= -3 → the same means, but the selected Face as the Muxameter is
  // the INTERNAL TRIANGLE to that Demometer. Face K/2 matches the
  // Demometer's LEFT-side selection (no side-jump from -2).
  const negK = Math.pow(2, -N - 1);
  const negDiameters = Math.pow(2, -N - 2);
  const ta1 = (2 * PI * (negK / 2)) / negK - PI / 2;
  const ta2 = (2 * PI * (negK / 2 + 1)) / negK - PI / 2;
  const tv1 = [cx + R * Math.cos(ta1), cy + R * Math.sin(ta1)];
  const tv2 = [cx + R * Math.cos(ta2), cy + R * Math.sin(ta2)];
  return (
    <g>
      <BDCircle cx={cx} cy={cy} r={R} diameters={negDiameters} highlight={null} />
      <path d={`M ${cx},${cy} L ${tv1[0]},${tv1[1]} L ${tv2[0]},${tv2[1]} Z`} fill={`${C.mx}55`} stroke={C.mx} strokeWidth={1.5} />
      <line x1={tv1[0]} y1={tv1[1]} x2={tv2[0]} y2={tv2[1]} stroke={C.mx} strokeWidth={2.5} />
      <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.mx} fontSize="9" fontWeight="900" fontFamily={orbi}>{`MUXAMETER 1/${negK} · THE INTERNAL TRIANGLE`}</text>
      <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.mx}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>THE TRIANGLE WITHIN THE SELECTED FACE</text>
    </g>
  );
}

// MODE 3 — DYADIC DIAMETER (single circle; Diameter folds into Radius at 0−N)
function BDDiameterViz({ N }) {
  const cx = 120, cy = 120, R = 80;
  const orbi = "'Orbitron', sans-serif";

  // Shared circle outline
  const circleEl = <circle cx={cx} cy={cy} r={R} fill="none" stroke={`${C.di}33`} strokeWidth={1} />;
  const kentron = <circle cx={cx} cy={cy} r={3} fill={C.di} />;

  if (N === 0) {
    // The dual reading held at once: 1 Diameter DRAWN (the singular
    // through-measure, the Viète seed) anor UNDRAWN (the Entire Manifold, dashed)
    return (
      <g>
        {circleEl}
        <circle cx={cx} cy={cy} r={R} fill={`${C.di}0d`} stroke={`${C.di}66`} strokeWidth={1.5} strokeDasharray="4 4" />
        <line x1={cx - R} y1={cy} x2={cx + R} y2={cy} stroke={C.di} strokeWidth={2.5} />
        {kentron}
        <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.di} fontSize="9" fontWeight="900" fontFamily={orbi}>1 DIAMETER · DRAWN ANOR UNDRAWN</text>
        <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.di}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>THE ENTIRE MANIFOLD</text>
      </g>
    );
  }

  if (N > 0) {
    // 2^N diameters radiating through Kentron (polygon-style, matches Section I)
    const dCount = Math.pow(2, N);
    const lines = [];
    for (let i = 0; i < dCount; i++) {
      const a = PI * i / dCount - PI / 2;
      lines.push(
        <line key={`d${i}`}
          x1={cx + R * Math.cos(a)} y1={cy + R * Math.sin(a)}
          x2={cx - R * Math.cos(a)} y2={cy - R * Math.sin(a)}
          stroke={C.di} strokeWidth={1.5} opacity={0.85} />
      );
    }
    return (
      <g>
        {circleEl}
        {lines}
        {kentron}
        <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.di} fontSize="10" fontWeight="900" fontFamily={orbi}>{`${dCount} DIAMETERS · Dia = 2^${N}`}</text>
      </g>
    );
  }

  // N < 0: the uniform fold D = 2^N — the stepping starts EARLY at −1 (the Radius)
  // Toward 9 o'clock for visual clarity (left direction)
  // At N=-1: full radius (1/2 D); N=-2: 1/4 D; N=-3: 1/8 D
  const absN = -N; // 1, 2, 3...
  const fraction = 1 / Math.pow(2, absN); // -1 → 1/2, -2 → 1/4, -3 → 1/8
  const lineLen = R * fraction * 2;  // at -1, lineLen = R; at -2, R/2; at -3, R/4
  const x2 = cx - lineLen;
  const label = absN === 1 ? "1/2 D = RADIUS · PRE-ORIGIN" : `1/${Math.pow(2, absN)} D · FOLDED INWARD`;
  const sub = absN === 1 ? "KENTRON → PERIMETER · WITHIN 1 DEMO ANOR MUXA" : "THE FOLD TOWARD KENTRON";

  return (
    <g>
      {circleEl}
      {/* At -1 the single Demometer anor Muxameter (faint de Face) holds the
          Radius within it: the last means of similarity between the Measures. */}
      {absN === 1 && (
        <circle cx={cx} cy={cy} r={R} fill={`${C.de}14`} stroke={`${C.de}44`} strokeWidth={1} />
      )}
      {/* Half-diameter from Kentron outward toward 9 o'clock */}
      <line x1={cx} y1={cy} x2={x2} y2={cy} stroke={C.di} strokeWidth={3} />
      {/* Subtle full-diameter reference (faint) at N=-1 only, to show the Radius IS half */}
      {absN === 1 && (
        <line x1={cx - R} y1={cy} x2={cx + R} y2={cy} stroke={`${C.di}22`} strokeWidth={1} strokeDasharray="3 3" />
      )}
      {kentron}
      <circle cx={x2} cy={cy} r={2.5} fill={C.di} />
      <text x={cx} y={cy - R - 8} textAnchor="middle" fill={C.di} fontSize="9" fontWeight="900" fontFamily={orbi}>{label}</text>
      <text x={cx} y={cy + R + 18} textAnchor="middle" fill={`${C.di}cc`} fontSize="8" fontWeight="700" fontFamily={orbi}>{sub}</text>
    </g>
  );
}

// BDViz — mode-dispatched visualization wrapper
function BDViz({ N, mode }) {
  if (mode === "muxameter") return <BDMuxameterViz N={N} />;
  if (mode === "diameter") return <BDDiameterViz N={N} />;
  return <BDDemometerViz N={N} />;
}

function BidirectionalDyad() {
  const [N, setN] = useState(0);
  const [mode, setMode] = useState("muxameter");
  const absN = N < 0 ? -N : N;

  let muxLabel, diameterLabel, demometerLabel;
  // Dia = 2^N (the count of drawn Diameters — named Dia to stand clear of d,
  // the diameter length) · M = 2^(N+1) for BOTH the Demometer and the
  // Muxameter — the Muxameter MIRRORS the Demometer at every station and
  // separates only at N >= 1, where the Dyadic introduces the connecting edge.
  if (N === 0) {
    diameterLabel = "1"; demometerLabel = "2";
  } else if (N > 0) {
    diameterLabel = String(Math.pow(2, N));
    demometerLabel = String(Math.pow(2, N + 1));
  } else {
    diameterLabel = `1/${Math.pow(2, absN)}`;
    demometerLabel = N === -1 ? "1" : `1/${Math.pow(2, absN - 1)}`;
  }
  muxLabel = demometerLabel;

  const isOrigin = N === 0;
  const isWithin = N < 0;
  const isFrom = N > 0;

  // Per-mode descriptions — each mode surfaces a distinct proof for the same N range
  const descByMode = {
    muxameter: {
      "-3": { t: "N = −3 · Muxameter 1/4 · The Internal Triangle",

      "-2": { t: "N = −2 · Muxameter 1/2 · Same as the Demometer",

      "1":  { t: "N = +1 · Muxameter 4 · The Triangles of the Dyadic",
              b: "M = 2^(1+1) = 4. The 2nd Diameter — the Dyadic — is introduced, and the Muxameter separates from the Demometer: each sector gains its connecting edge, the chord that does not extend to the arc. Four triangles. The additional measure IS Viète's M — π = M·s_M/2." },
      "2":  { t: "N = +2 · Muxameter 8 · The Triangles Compound",
              b: "M = 8 triangles — sector plus connecting edge, the polygon closing around the Face. Face-read integrates; edge-read traces the perimeter — the edges grow more precise around the Face as M doubles." },
      "3":  { t: "N = +3 · Muxameter 16 · Toward the Limit",
              b: "M = 16. The integrated measure expands as the Face holds more triangles at once. To the limit, edge and legs fold toward one line — where they become indistinguishable is the Bounding Limit of Measurement (Section IV)." }
    },
    demometer: {
      "-3": { t: "N = −3 · Demometer 1/4 · The Quarter Selected",
              b: "One circle — no pairing needed. Two Diameters set 4 potential Demometers; the quarter sector is selected, the 3 other Faces unselected. In the negatives we are selecting specific Faces — the bearing counts up from Origin (2 Diameters) even as the selection deepens." },
      "-2": { t: "N = −2 · Demometer 1/2 · Selection Begins",
              b: "One circle. One Diameter. Two potential Demometers — 1/2 selected from the potential. The Demometer is reliant on a Diameter once selection begins — borne by 1 Diameter, the bearing offset from Origin." },
      "-1": { t: "N = −1 · Demometer 1 · The Whole Face",
              b: "1 Demometer — the Whole Face drawn: a Demometer anor a Manifold. In the Demometer's scope no Diameter need be drawn — the arc itself, the total circle's edge, is every point a Muxameter or the legs of a Demometer can trace. The Radius — 1/2 a Diameter — stays shown WITHIN the Face: the last means of similarity between the Measures at −1. Staggered by N+1, each measuring itself: the divergence that proves Diameter and Demometer are Different Measures." },
      "0":  { t: "N = 0 · Demometer 2 · ORIGIN",
              b: "The Pair as count — two Demometers cut by the one drawn Diameter (M = 2^(0+1) = 2). The Demometer is the classic sector, extending to the arc; the Muxameter mirrors its count — two halves — whose connecting edge awaits the Dyadic." },
      "1":  { t: "N = +1 · Demometer 4 · Count Outward",

      "2":  { t: "N = +2 · Demometer 8 · Count Outward",
              b: "Two Pairs of Diameters generate 8 Demometers. The polygon begins to approach the circle." },
      "3":  { t: "N = +3 · Demometer 16 · Count Outward",
              b: "Four Pairs of Diameters generate 16 Demometers. Outward count compounds toward +∞." }
    },
    diameter: {
      "-3": { t: "N = −3 · 1/8 Diameter · Folded Inward",
              b: "2^−3 = 1/8 of a Diameter from Kentron outward. The fold compounds toward Kentron — the uniform law D = 2^N holds at every station." },
      "-2": { t: "N = −2 · 1/4 Diameter · Folded Inward",
              b: "2^−2 = 1/4 of a Diameter. Each step at 0 − N halves the reach toward Kentron — the Diameter folds back into the geometric ground from which it was drawn." },

              padding: "8px 10px",

              fontSize: 10,

              color: active ? m.color : `${m.color}cc`,

      <div style={{ textAlign: "center", fontSize: 9, fontFamily: orbi, fontWeight: 700, letterSpacing: "1.5px", color: C.tm, marginBottom: 6 }}>

              <div style={{ fontSize: 8, color: C.de, fontFamily: orbi, fontWeight: 700 }}>DEMOMETER</div>

            </div>
            <div style={{ background: `${C.mx}11`, border: `1px solid ${C.mx}33`, borderRadius: 8, padding: 8, textAlign: "center", opacity: cardFlagged("muxameter") ? 0.45 : 1, transition: "opacity 0.2s" }}>

// ─── SECTION III: SECTOR INSPECTOR ───
function SectorInspector() {
  const [n, setN] = useState(0);
  const D = Math.pow(2, n), M = 2 * D;
  const cx = 120, cy = 120, r = 95;
  const a1 = -PI / 2, a2 = -PI / 2 + 2 * PI / M;
  const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
  return (
    <div>
      <STitle num="III" title="The Finite Case" sub="At every finite order, sectors are Demometers — not Muxameters" />
      <svg viewBox="0 0 240 240" style={{ width: "100%", maxWidth: 260, display: "block", margin: "0 auto" }}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.sl} strokeWidth={1} />
        {Array.from({ length: D }, (_, i) => {
          const a = PI * i / D - PI / 2;
          return <line key={i} x1={cx + r * Math.cos(a)} y1={cy + r * Math.sin(a)} x2={cx - r * Math.cos(a)} y2={cy - r * Math.sin(a)} stroke={`${C.di}44`} strokeWidth={0.8} />;
        })}
        <path d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${M <= 2 ? 1 : 0} 1 ${x2},${y2} Z`} fill={`${C.de}20`} />
        <line x1={cx} y1={cy} x2={x1} y2={y1} stroke={C.like} strokeWidth={2.5} />
        <line x1={cx} y1={cy} x2={x2} y2={y2} stroke={C.like} strokeWidth={2.5} />
        <path d={`M${x1},${y1} A${r},${r} 0 ${M <= 2 ? 1 : 0} 1 ${x2},${y2}`} fill="none" stroke={C.unlike} strokeWidth={2.5} strokeDasharray="4 3" />
        <circle cx={cx} cy={cy} r={2.5} fill={C.di} />
      </svg>
      {/* Stepper matching Section I orders */}
      <div style={{ display: "flex", justifyContent: "center", gap: 4, margin: "10px 0" }}>
        {[0, 1, 2, 3, 4, 5, 6, 7].map(i => (
          <button key={i} onClick={() => setN(i)} style={{
            width: 34, height: 34, borderRadius: 8,
            background: n === i ? C.de : "transparent",
            color: n === i ? C.bg : C.de,
            border: `1.5px solid ${n === i ? C.de : `${C.de}44`}`,
            fontFamily: "'Orbitron', sans-serif", fontSize: 12, fontWeight: 900, cursor: "pointer",
          }}>{i}</button>
        ))}
      </div>
      <div style={{ textAlign: "center", fontSize: 11, lineHeight: 1.8 }}>
        <span style={{ color: C.tm, fontSize: 9 }}>Order {n}</span> · <span style={{ color: C.di }}>{D} Diameter{D > 1 ? "s" : ""}</span> · <span style={{ color: C.de }}>{M} Sector{M > 1 ? "s" : ""}</span><br />
        {n === 0
          ? <><span style={{ color: C.like }}>1 like edge</span> (diameter) + <span style={{ color: C.unlike }}>1 unlike edge</span> (semicircular arc)</>
          : <><span style={{ color: C.like }}>2 like edges</span> (radii) + <span style={{ color: C.unlike }}>1 unlike edge</span> (arc)</>}<br />
        <span style={{ color: C.tm, fontStyle: "italic" }}>Sector = Demometer (not Muxameter)</span>
      </div>
    </div>
  );
}

    { x: 80, y: 65, l: "Botany", qs: ["Growth", "Cycles", "Systems"], c: "#4caf50" },
    { x: 250, y: 50, l: "Economics", qs: ["Growth", "Cycles", "Systems"], c: "#ff9800" },
    { x: 50, y: 180, l: "Music", qs: ["Harmony", "Cycles", "Pattern"], c: "#9c27b0" },
    { x: 270, y: 175, l: "Architecture", qs: ["Structure", "Systems", "Pattern"], c: "#2196f3" },
    { x: 165, y: 125, l: "Biology", qs: ["Growth", "Cycles", "Structure"], c: "#e91e63" },
  ];
  const dias = [];
  for (let i = 0; i < concepts.length; i++)
    for (let j = i + 1; j < concepts.length; j++) {
      const sh = concepts[i].qs.filter(q => concepts[j].qs.includes(q));
      if (sh.length > 0) dias.push({ from: i, to: j, shared: sh });
    }
  const muxs = [];
  for (let i = 0; i < concepts.length; i++)
    for (let j = i + 1; j < concepts.length; j++)
      for (let k = j + 1; k < concepts.length; k++) {
        if (dias.find(d => (d.from === i && d.to === j) || (d.from === j && d.to === i)) &&
          dias.find(d => (d.from === j && d.to === k) || (d.from === k && d.to === j)) &&
          dias.find(d => (d.from === i && d.to === k) || (d.from === k && d.to === i)))
          muxs.push({ v: [i, j, k] });
      }
  const actMux = hv !== null ? muxs.filter(m => m.v.includes(hv)) : (showMux ? muxs : []);

  return (
    <div>
      <STitle num="VII" title="Muxonomy" sub="The complete topology — Demometers composed through Diameters into a Manifold" />
      <svg viewBox="0 0 330 230" style={{ width: "100%", maxWidth: 340, display: "block", margin: "0 auto" }}>
        {actMux.map((m, i) => {
          const [a, b, c] = m.v.map(v => concepts[v]);
          return <polygon key={i} points={`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`} fill={`${C.mx}12`} stroke={`${C.mx}44`} strokeWidth="1" />;
        })}
        {dias.map((d, i) => {
          const f = concepts[d.from], t = concepts[d.to];
          const h = hv === d.from || hv === d.to;
          const mx = (f.x + t.x) / 2, my = (f.y + t.y) / 2;
          return (<g key={i}>
            <line x1={f.x} y1={f.y} x2={t.x} y2={t.y} stroke={h ? C.di : `${C.di}33`} strokeWidth={h ? 2 : 1} />
            {h && <text x={mx} y={my - 6} textAnchor="middle" fill={C.di} fontSize="7" fontWeight="700" fontFamily="'IBM Plex Mono', monospace">{d.shared.join(", ")}</text>}
          </g>);
        })}
        {concepts.map((c, i) => (
          <g key={i} onMouseEnter={() => setHv(i)} onMouseLeave={() => setHv(null)} style={{ cursor: "pointer" }}>
            <circle cx={c.x} cy={c.y} r={hv === i ? 24 : 20} fill={`${c.c}22`} stroke={c.c} strokeWidth={hv === i ? 2.5 : 1.5} />
            <text x={c.x} y={c.y - 1} textAnchor="middle" fill={C.tx} fontSize="8" fontWeight="900" fontFamily="'Orbitron', sans-serif">{c.l}</text>
            <text x={c.x} y={c.y + 9} textAnchor="middle" fill={C.tm} fontSize="5.5" fontFamily="'IBM Plex Mono', monospace">{c.qs.join("·")}</text>
          </g>
        ))}
      </svg>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 10 }}>
        {[
          { l: "DEMOMETERS", v: concepts.length, c: C.de },
          { l: "DIAMETERS", v: dias.length, c: C.di },
          { l: "MUXAMETERS", v: muxs.length, c: C.mx, tap: true },
        ].map((m, i) => (
          <div key={i} style={{ background: `${m.c}11`, border: `1px solid ${m.c}33`, borderRadius: 8, padding: 8, textAlign: "center", cursor: m.tap ? "pointer" : "default" }}
            onClick={m.tap ? () => setSM(!showMux) : undefined}>
            <div style={{ fontSize: 8, color: m.c, fontFamily: "'Orbitron', sans-serif", fontWeight: 700 }}>{m.l}</div>
            <div style={{ fontSize: 18, fontWeight: 900, color: C.tx, fontFamily: "'Orbitron', sans-serif" }}>{m.v}</div>
            {m.tap && <div style={{ fontSize: 8, color: m.c }}>{showMux ? "hide" : "show"} faces</div>}
          </div>
        ))}
      </div>
      <div style={{ textAlign: "center", fontSize: 10, color: C.tm, marginTop: 10, lineHeight: 1.6 }}>
        Hover a concept to see its Diameters. Tap MUXAMETERS to show integrated faces.
      </div>
      <div style={{ background: `${C.mx}08`, border: `1px solid ${C.mx}33`, borderRadius: 10, padding: 10, marginTop: 10, textAlign: "center",
        fontSize: 10, color: C.tx, lineHeight: 1.7 }}>
        <span style={{ color: C.mx, fontWeight: 700 }}>The total Conceptual Space is a Manifold.</span><br />
        <span style={{ color: C.tm }}>
          Multiple Muxameters sharing Diameters compose one integrated structure.<br />

        </span>
      </div>
    </div>
  );
}
